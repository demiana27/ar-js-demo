<!DOCTYPE html>
<html>
  <head>
    <title>Demiana's AR.js Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }

      #top-banner {
        position: fixed;
        top: 0; left: 0; right: 0;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        color: white;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 999;
      }

      #top-banner .dot {
        width: 10px; height: 10px;
        background: #00f5a0;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }

      #top-banner span { font-size: 13px; }
      #top-banner strong { color: #00f5a0; }

      #instruction-box {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(26, 26, 46, 0.92);
        color: white;
        padding: 16px 28px;
        border-radius: 50px;
        font-size: 15px;
        text-align: center;
        border: 1px solid rgba(0, 245, 160, 0.3);
        z-index: 999;
        white-space: nowrap;
      }

      #tap-counter {
        position: fixed;
        top: 70px;
        right: 16px;
        background: rgba(26,26,46,0.85);
        color: #00f5a0;
        border: 1px solid rgba(0,245,160,0.4);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 13px;
        text-align: center;
        z-index: 999;
      }

      #tap-counter .count {
        font-size: 26px;
        font-weight: bold;
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- UI -->
    <div id="top-banner">
      <div class="dot"></div>
      <span>AR.js Demo by <strong>Demiana</strong> · Point at the <strong>Hiro Marker</strong></span>
    </div>

    <div id="tap-counter">
      <span class="count" id="countNum">0</span>
      taps
    </div>

    <div id="instruction-box">
      🎯 Scan the Hiro marker → tap the box to change color!
    </div>

    <!-- AR Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
    >
      <a-marker preset="hiro">

        <!-- Virtual 3D Box -->
        <a-box
          id="arBox"
          position="0 0.5 0"
          rotation="0 45 0"
          color="#FF6B6B"
          scale="1 1 1"
          animation="property: rotation; to: 0 405 0; loop: true; dur: 4000; easing: linear"
        ></a-box>

        <!-- Platform under the box -->
        <a-cylinder
          position="0 0.05 0"
          radius="0.8"
          height="0.1"
          color="#1a1a2e"
          opacity="0.7"
        ></a-cylinder>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- Interaction -->
    <script>
      const box = document.getElementById('arBox');
      const instruction = document.getElementById('instruction-box');
      const countNum = document.getElementById('countNum');

      const colors = [
        '#FF6B6B', '#4ECDC4', '#FFE66D',
        '#A8E6CF', '#FF8B94', '#6C5CE7',
        '#FD79A8', '#00CEC9'
      ];

      const messages = [
        '🎨 Color changed! Tap again!',
        '✨ Nice! Keep tapping!',
        '🌈 Another color!',
        '🔥 Yellow!', '💚 Mint green!',
        '💜 Purple!', '🌸 Rose pink!',
        '🌊 Cyan!'
      ];

      let colorIndex = 0;
      let tapCount = 0;

      box.addEventListener('click', function () {
        colorIndex = (colorIndex + 1) % colors.length;
        tapCount++;
        box.setAttribute('color', colors[colorIndex]);
        countNum.innerText = tapCount;
        instruction.innerText = messages[tapCount % messages.length];
      });
    </script>

  </body>
</html>
